<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Contador de Dinero</title>
<style>
:root{
  --cup:#0288d1;
  --cup-bg:#e3f3fc;
  --cup-line:#90cbee;
  --usd:#0299b0;
  --usd-bg:#e2f6f7;
  --usd-line:#8fd6dd;
  --total-bg:#e8f2fb;
  --total:#01579b;
  --ink:#18160f;
  --muted:#8a7f70;
  --line:#e3edf4;
  --bg:#f2f7fb;
  --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
.hdr{
  background:#29abe2;color:#fff;
  padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.hdr-title{font-size:14px;font-weight:800;letter-spacing:-.01em;}
.hdr-sub{font-size:9px;color:#ffffffc0;margin-top:1px;}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{
  width:30px;height:30px;border-radius:50%;
  background:#ffffff30;color:#fff;border:none;
  font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.icon-btn:active{background:#ffffff4a;}

/* ── RATE BAR ── */
.rate-bar{
  background:var(--usd-bg);
  border-bottom:1px solid var(--usd-line);
  padding:5px 12px;
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.rate-lbl{font-size:10px;font-weight:700;color:var(--usd);flex:1;}
.rate-wrap{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);}
.rate-inp{
  width:60px;padding:2px 5px;
  border:1px solid var(--usd-line);border-radius:5px;
  font-size:12px;font-weight:800;color:var(--usd);
  font-family:inherit;text-align:right;background:#fff;
}
.rate-inp:focus{outline:none;border-color:var(--usd);}

/* ── COLUMN HEADERS ── */
.col-hdrs{
  display:grid;grid-template-columns:1fr 1fr;
  border-bottom:2px solid var(--line);
  flex-shrink:0;
}
.col-hdr{
  padding:5px 10px;
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:4px;
}
.col-hdr.cup{color:var(--cup);border-right:1px solid var(--line);}
.col-hdr.usd{color:var(--usd);}
.col-total{
  margin-left:auto;
  font-size:11px;font-weight:800;letter-spacing:0;text-transform:none;
  font-family:"Georgia",serif;
}

/* ── BILL GRID ── */
.bills-wrap{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  min-height:0;
}
.bills-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}

/* ── BILL ROW ── */
.bill-row{
  display:flex;align-items:center;gap:4px;
  padding:6px 8px;
  border-bottom:1px solid var(--line);
  background:var(--white);
}
.bill-row.cup{border-right:1px solid var(--line);}
.bill-row.usd{background:#fafdfe;}

.denom{
  font-size:15px;font-weight:800;
  font-family:"Georgia",serif;
  width:38px;flex-shrink:0;
  letter-spacing:-.02em;
}
.denom.cup{color:var(--cup);}
.denom.usd{color:var(--usd);}

.op{
  font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;
}

.qinp{
  flex:1;min-width:0;max-width:46px;
  text-align:center;
  border:none;border-bottom:1.5px solid var(--line);
  padding:1px 1px 3px;
  font-size:16px;font-weight:700;
  font-family:inherit;background:transparent;
}
.qinp:focus{outline:none;}
.cup .qinp{border-color:var(--cup-line);}
.usd .qinp{border-color:var(--usd-line);}
.cup .qinp:focus{border-color:var(--cup);}
.usd .qinp:focus{border-color:var(--usd);}

.sub{
  font-size:13px;font-weight:700;
  font-family:"Georgia",serif;
  flex:1;min-width:0;
  text-align:right;
  letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sub.cup{color:var(--cup);}
.sub.usd{color:var(--usd);}

/* ── FILLER for uneven rows ── */
.bill-filler{
  border-bottom:1px solid var(--line);
  background:var(--white);
}

/* ── FOOTER ── */
.footer{
  background:var(--white);
  border-top:2px solid var(--line);
  padding:12px 14px 14px;
  flex-shrink:0;
}
.totals-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:10px;
}
.tot-box{
  border-radius:10px;padding:10px 14px;
}
.tot-box.cup{background:var(--cup-bg);border:1px solid var(--cup-line);}
.tot-box.usd{background:var(--usd-bg);border:1px solid var(--usd-line);}
.tot-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.tot-lbl.cup{color:var(--cup);}
.tot-lbl.usd{color:var(--usd);}
.tot-val{font-size:23px;font-weight:800;font-family:"Georgia",serif;letter-spacing:-.02em;}
.tot-val.cup{color:var(--cup);}
.tot-val.usd{color:var(--usd);}

.grand-row{
  background:var(--total-bg);
  border:1px solid #b8dcf2;
  border-radius:10px;
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.grand-lbl{font-size:12px;font-weight:700;color:var(--total);text-transform:uppercase;letter-spacing:.05em;}
.grand-val{font-size:27px;font-weight:800;font-family:"Georgia",serif;color:var(--total);letter-spacing:-.02em;white-space:nowrap;}
.grand-conv{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── SETTINGS OVERLAY ── */
.settings-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:50;
  display:none;flex-direction:column;
}
.settings-overlay.open{display:flex;}
.settings-hdr{
  background:#29abe2;color:#fff;
  padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.settings-back{
  background:none;border:none;color:#fff;
  font-size:20px;line-height:1;cursor:pointer;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.settings-title{font-size:17px;font-weight:800;}
.settings-body{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px 14px 30px;
}
.settings-hint{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.4;}
.denom-card{
  background:var(--white);
  border-radius:12px;
  padding:16px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.denom-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  row-gap:26px;column-gap:6px;
}
.denom-item{
  display:flex;align-items:center;gap:8px;
  font-size:19px;font-weight:800;
  font-family:"Georgia",serif;
  color:var(--cup);
  cursor:pointer;
}
.denom-check{
  width:24px;height:24px;flex-shrink:0;
  accent-color:var(--cup);
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">💵 Contador de Dinero</div>
    <div class="hdr-sub">CUP · USD · Conversión automática</div>
  </div>
  <div class="hdr-actions">
    <button class="icon-btn" onclick="openSettings()" title="Ajustes">⚙️</button>
    <button class="icon-btn" onclick="clearAll()" title="Limpiar todo">🧹</button>
  </div>
</div>

<div class="rate-bar">
  <div class="rate-lbl">💱 Tasa de cambio</div>
  <div class="rate-wrap">
    <span>1 USD =</span>
    <input type="number" class="rate-inp" id="rate" value="670" min="1">
    <span>CUP</span>
  </div>
</div>

<div class="col-hdrs">
  <div class="col-hdr cup">🇨🇺 CUP <span class="col-total" id="hdr-cup">0</span></div>
  <div class="col-hdr usd">🇺🇸 USD <span class="col-total" id="hdr-usd">$0</span></div>
</div>

<div class="bills-wrap">
  <div class="bills-grid" id="bills-grid"></div>
</div>

<div class="footer">
  <div class="totals-row">
    <div class="tot-box cup">
      <div class="tot-lbl cup">Total CUP</div>
      <div class="tot-val cup" id="tot-cup">0.00</div>
    </div>
    <div class="tot-box usd">
      <div class="tot-lbl usd">Total USD</div>
      <div class="tot-val usd" id="tot-usd">$0.00</div>
    </div>
  </div>
  <div class="grand-row">
    <div>
      <div class="grand-lbl">Total en CUP</div>
      <div class="grand-conv" id="grand-conv">CUP + USD×tasa</div>
    </div>
    <div class="grand-val" id="grand-val">0.00</div>
  </div>
</div>

<!-- ── PANTALLA DE AJUSTES ── -->
<div class="settings-overlay" id="settings-overlay">
  <div class="settings-hdr">
    <button class="settings-back" onclick="closeSettings()">←</button>
    <div class="settings-title">Ajustes</div>
  </div>
  <div class="settings-body">
    <div class="settings-hint">Elige qué denominaciones de CUP quieres ver en el contador.</div>
    <div class="denom-card">
      <div class="denom-grid" id="denom-grid"></div>
    </div>
  </div>
</div>

<script>
const ALL_CUP = [10000,5000,2000,1000,500,200,100,50,20,10,5,3,1];
const USD = [100,50,20,10,5,2,1];
const qty = {};
let CUP = [];

function fmtD(d){ return d>=1?String(d):d.toFixed(2); }
function fmt(n,d=2){ return n.toLocaleString('es-CU',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function getRate(){ return parseFloat(document.getElementById('rate').value)||670; }

/* ── Persistencia de denominaciones habilitadas ── */
function loadEnabledCup(){
  try{
    const saved = JSON.parse(localStorage.getItem('cd_cup_denoms'));
    if(Array.isArray(saved) && saved.length) return saved.filter(d=>ALL_CUP.includes(d));
  }catch(e){}
  return [1000,500,200,100,50,20,10,5,3,1]; // por defecto (igual que antes)
}
function saveEnabledCup(list){
  localStorage.setItem('cd_cup_denoms', JSON.stringify(list));
}

let enabledCup = loadEnabledCup();

[...ALL_CUP.map(d=>'c'+d), ...USD.map(d=>'u'+d)].forEach(k=>qty[k]=0);

/* ── Construir grid principal (CUP habilitados + USD) ── */
function renderGrid(){
  CUP = ALL_CUP.filter(d=>enabledCup.includes(d));
  const grid = document.getElementById('bills-grid');
  grid.innerHTML='';
  const maxRows = Math.max(CUP.length, USD.length);

  for(let i=0;i<maxRows;i++){
    if(i<CUP.length){
      const d=CUP[i], k='c'+d;
      const cell=document.createElement('div');
      cell.className='bill-row cup';
      cell.innerHTML=`
        <span class="denom cup">${fmtD(d)}</span>
        <span class="op">x</span>
        <input class="qinp" id="inp_${k}" type="number" min="0" inputmode="numeric" value="${qty[k]||0}" onfocus="this.select()" oninput="sq('${k}',this.value)">
        <span class="op">=</span>
        <span class="sub cup" id="sub_${k}">0</span>`;
      grid.appendChild(cell);
    } else {
      const fill=document.createElement('div');
      fill.className='bill-filler cup';
      grid.appendChild(fill);
    }
    if(i<USD.length){
      const d=USD[i], k='u'+d;
      const cell=document.createElement('div');
      cell.className='bill-row usd';
      cell.innerHTML=`
        <span class="denom usd">$${fmtD(d)}</span>
        <span class="op">x</span>
        <input class="qinp" id="inp_${k}" type="number" min="0" inputmode="numeric" value="${qty[k]||0}" onfocus="this.select()" oninput="sq('${k}',this.value)">
        <span class="op">=</span>
        <span class="sub usd" id="sub_${k}">$0</span>`;
      grid.appendChild(cell);
    } else {
      const fill=document.createElement('div');
      fill.className='bill-filler';
      grid.appendChild(fill);
    }
  }
  update();
}

function sq(k,v){
  qty[k]=Math.max(0,parseInt(v)||0);
  update();
}

function update(){
  const rate=getRate();
  let cupTotal=0, usdTotal=0;

  CUP.forEach(d=>{
    const k='c'+d, q=qty[k]||0, s=q*d;
    cupTotal+=s;
    const el=document.getElementById('sub_'+k);
    if(el) el.textContent=fmt(s,0);
  });
  USD.forEach(d=>{
    const k='u'+d, q=qty[k]||0, s=q*d;
    usdTotal+=s;
    const el=document.getElementById('sub_'+k);
    if(el) el.textContent='$'+fmt(s,0);
  });

  const usdInCup=usdTotal*rate;
  const grand=cupTotal+usdInCup;

  document.getElementById('hdr-cup').textContent=fmt(cupTotal,0);
  document.getElementById('hdr-usd').textContent='$'+fmt(usdTotal,0);
  document.getElementById('tot-cup').textContent=fmt(cupTotal);
  document.getElementById('tot-usd').textContent='$'+fmt(usdTotal);
  document.getElementById('grand-val').textContent=fmt(grand);
  document.getElementById('grand-conv').textContent=
    fmt(cupTotal)+' + '+fmt(usdInCup)+' (USD×'+rate+')';
}

function clearAll(){
  Object.keys(qty).forEach(k=>{
    qty[k]=0;
    const el=document.getElementById('inp_'+k);
    if(el) el.value=0;
  });
  update();
}

/* ── Pantalla de Ajustes ── */
function buildSettings(){
  const g = document.getElementById('denom-grid');
  g.innerHTML='';
  ALL_CUP.forEach(d=>{
    const id='chk_'+d;
    const label=document.createElement('label');
    label.className='denom-item';
    label.setAttribute('for',id);
    label.innerHTML=`<input type="checkbox" class="denom-check" id="${id}" ${enabledCup.includes(d)?'checked':''} onchange="toggleDenom(${d},this.checked)"><span>${fmtD(d)}</span>`;
    g.appendChild(label);
  });
}

function toggleDenom(d,checked){
  if(checked){
    if(!enabledCup.includes(d)) enabledCup.push(d);
  } else {
    if(enabledCup.length>1) enabledCup=enabledCup.filter(x=>x!==d);
    else { // no permitir dejar 0 denominaciones activas
      document.getElementById('chk_'+d).checked=true;
      return;
    }
  }
  enabledCup.sort((a,b)=>b-a);
  saveEnabledCup(enabledCup);
  renderGrid();
}

function openSettings(){
  buildSettings();
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings(){
  document.getElementById('settings-overlay').classList.remove('open');
}

document.getElementById('rate').addEventListener('input',update);
renderGrid();
</script>
</body>
</html>

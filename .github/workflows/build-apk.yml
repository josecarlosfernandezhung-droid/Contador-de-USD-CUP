name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir plataforma Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Permitir que la app lea el servidor de pedidos por HTTP en la red local
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$MANIFEST" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          node -e "
          const fs = require('fs');
          if (fs.existsSync('capacitor.config.json')) {
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.server = c.server || {};
            c.server.cleartext = true;
            c.android = c.android || {};
            c.android.allowMixedContent = true;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
            console.log('capacitor.config.json actualizado');
          } else {
            console.log('No hay capacitor.config.json: solo se ajusto el manifiesto');
          }
          "

      - name: Generar íconos y splash desde assets/
        run: npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: contador-de-dinero-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
